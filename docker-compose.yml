version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: stm_db
      POSTGRES_USER: stm_user
      POSTGRES_PASSWORD: stm_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: stm_db
      DB_USER: stm_user
      DB_PASSWORD: stm_pass
      DB_HOST: db
      DB_PORT: 5432
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_ADMIN_EMAILS: ${GOOGLE_ADMIN_EMAILS}
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      - backend

volumes:
  pgdata:
